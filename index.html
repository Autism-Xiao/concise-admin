<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%VITE_APP_NAME%</title>
    <script>
      // 首帧前确定主题，避免暗色模式刷新时白屏闪烁（与 next-themes 的存储键保持一致）
      ;(function () {
        try {
          var theme = localStorage.getItem('theme') || 'system'
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          if (isDark) root.classList.add('dark')
          root.style.colorScheme = isDark ? 'dark' : 'light'
          // dev 模式下样式由 JS 注入，先铺一层背景色盖住无样式的白屏窗口
          root.style.backgroundColor = isDark ? 'oklch(0.145 0 0)' : 'oklch(1 0 0)'

          // 上次保存的界面设置（字号 / 主题色变量 / 滤镜）：settings-provider 每次应用样式时
          // 会把这串 CSS 缓存到 localStorage，这里在 React 起来之前先套上，
          // 避免「默认主题 → 云端/本地设置」之间闪一下
          var cachedCss = localStorage.getItem('concise-settings-css')
          if (cachedCss) {
            var styleEl = document.createElement('style')
            styleEl.id = 'app-settings-override'
            styleEl.textContent = cachedCss
            ;(document.head || root).appendChild(styleEl)
          }

          // 文字方向同理（RTL 用户刷新时不应该先按 LTR 排一遍版）
          var saved = localStorage.getItem('concise-settings')
          if (saved) {
            var dir = (JSON.parse(saved).settings || {}).direction
            if (dir === 'rtl' || dir === 'ltr') root.setAttribute('dir', dir)
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
